#
# MAPBASE SOURCE 2013 CI
#
# This can be used to manually build the codebase.
#
# See mapbase_build-base.yml for more information on how this works.

name: Build Projects (Manual)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Which configuration to build with'
        default: 'Release'
        required: true
        type: choice
        options:
        - Release
        - Debug
      game:
        description: 'Name of the game to build (if relevant)'
        default: 'tf /hl2mp'
        required: false
        type: choice
        options:
        - episodic /hl2
        - hl2
        - hl2mp
        - tf
        - tf /hl2mp
      project-group:
        description: 'Which group of projects to compile'
        required: true
        type: choice
        options:
        - everything
        - game
        - shaders
        - maptools
      arch:
        description: 'Which architecture to build for'
        default: '64'
        required: false
        type: choice
        options:
        - 64
        - 32
      build-windows:
        description: 'Build on Windows?'
        default: true
        required: false
        type: boolean
      build-linux:
        description: 'Build on Linux?'
        default: true
        required: false
        type: boolean

jobs:
  build_manual:
    uses: ./.github/workflows/mapbase_build-base.yml
    with:
      configuration: '${{ github.event.inputs.configuration }}'
      game: '${{ github.event.inputs.game }}'
      project-group: '${{ github.event.inputs.project-group }}'
      arch: '${{ github.event.inputs.arch }}'
      build-windows: "${{ github.event.inputs.build-windows == 'true' }}"
      build-linux: "${{ github.event.inputs.build-linux == 'true' }}"
