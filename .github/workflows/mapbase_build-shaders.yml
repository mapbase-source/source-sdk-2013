#
# MAPBASE SOURCE 2013 CI
#
# Builds shader projects every time a pull request which modifies the shader code is opened.
# If you're using a fork of Mapbase, feel free to configure this to meet your repository's needs.
#
# See mapbase_build-base.yml for more information on how this works.

name: Build Shaders

on:
  pull_request:
    branches:
      - develop
      - mapbase-mp-2025
    paths:
      - '.github/workflows/mapbase_build-shaders.yml'
      - 'src/vpc_scripts/**'
      - 'src/materialsystem/**'
      - 'src/mathlib/**'

jobs:
  shaders:
    strategy:
      matrix:
        configuration: [Release, Debug]
        arch: [32, 64]
        include:
          - game: 'episodic' # Should be switched to 'tf /hl2mp' once we figure out what's wrong with the MP projects
            arch: 64
          - game: 'episodic'
            arch: 32
    uses: ./.github/workflows/mapbase_build-base.yml
    with:
      configuration: ${{ matrix.configuration }}
      game: ${{ matrix.game }}
      project-group: 'shaders'
      build-linux: true # Disable this if you don't want to compile for Linux
      arch: ${{ matrix.arch }}
